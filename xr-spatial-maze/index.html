<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Spatial Maze Challenge</title>
    <meta
      name="description"
      content="Spatial memory maze: explore a full-size maze, then pick the matching layout. Desktop, mobile, and WebXR VR."
    />
    <script type="module" crossorigin src="./assets/index-BSIkkOTy.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-7zvEbf23.css">
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>

      <div id="hud" aria-live="polite">
        <div id="hud-title">Spatial Maze Challenge</div>
        <div id="hints">
          <strong>Desktop:</strong> WASD move · arrows look · Shift run · Space jump · hold RMB look · click / F select<br />
          <strong>VR:</strong> Enter VR · left stick move · right stick turn · trigger select · hold A/X teleport
        </div>
        <div id="mobile-hints">Left stick move · swipe to look · tap a panel to select</div>
        <div class="hud-actions">
          <button type="button" id="hide-hints" class="hint-toggle">Hide hints</button>
        </div>
      </div>
      <button type="button" id="music-toggle" class="music-fab" aria-pressed="true" aria-label="Music on. Click to turn off.">
        <svg class="music-fab__on" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M4 9v6h3.2L12 19V5L7.2 9H4z" />
          <path d="M16 8.5a4.5 4.5 0 0 1 0 7" fill="none" />
          <path d="M18.4 6.2a7.5 7.5 0 0 1 0 11.6" fill="none" />
        </svg>
        <svg class="music-fab__off" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M4 9v6h3.2L12 19V5L7.2 9H4z" />
          <path d="M16.2 9.2 21 14M21 9.2l-4.8 4.8" fill="none" />
        </svg>
      </button>
      <div id="align-hud" hidden></div>

      <div id="mobile-move" class="virtual-joystick" aria-hidden="true">
        <div class="virtual-joystick__knob"></div>
      </div>
      <div id="mobile-look" class="virtual-joystick virtual-joystick--look" aria-hidden="true">
        <div class="virtual-joystick__knob"></div>
      </div>

      <div id="vr-entry" class="vr-entry" aria-label="Virtual reality controls"></div>
      <div id="loading">Loading…</div>
    </div>
  </body>
</html>
