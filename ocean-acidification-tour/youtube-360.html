<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>360° video</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; }
    iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .back {
      position: absolute;
      left: 50%;
      bottom: 1.25rem;
      transform: translateX(-50%);
      z-index: 2;
    }
    .back a {
      color: #fff;
      font: 600 14px/1.2 Arial, Helvetica, sans-serif;
      text-decoration: none;
      padding: 0.55rem 1.1rem;
      border-radius: 999px;
      background: rgba(8, 20, 32, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.25);
    }
  </style>
</head>
<body>
  <iframe
    id="yt"
    width="640"
    height="360"
    title="YouTube 360 video player"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    allowfullscreen
  ></iframe>
  <p class="back"><a href="./">Back to tour</a></p>
  <script>
    const id = new URLSearchParams(location.search).get('v') || '';
    if (/^[\w-]{11}$/.test(id)) {
      document.getElementById('yt').src =
        'https://www.youtube.com/embed/' + encodeURIComponent(id) +
        '?autoplay=1&rel=0&enablejsapi=1&origin=' + encodeURIComponent(location.origin);
    }
  </script>
</body>
</html>
